[package]
name = "rsim-cli"
description = "Command-line front-end for the rsim rack-scale GPU simulator"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "rsim_cli"
path = "src/lib.rs"

[[bin]]
name = "rsim"
path = "src/main.rs"

[dependencies]
rsim-core.workspace = true
rsim-hw.workspace = true
rsim-sass.workspace = true
rsim-gpu.workspace = true
rsim-rack.workspace = true
rsim-net.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
anyhow.workspace = true
clap.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints]
workspace = true
