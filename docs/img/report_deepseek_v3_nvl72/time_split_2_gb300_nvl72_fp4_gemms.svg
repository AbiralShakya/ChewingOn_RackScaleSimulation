<svg class="rs" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 118" width="100%" role="img" aria-label="Where the GPU time goes" style="max-width:760px;height:auto"><style>.rs{font-family:Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --surface:#fcfcfb; --surface-2:#f3f2ef; --grid:#e6e5e0; --axis:#c9c7c0;
  --text:#0b0b0b; --text-2:#52514e; --text-3:#7a7873;
  --c-tensor:#2a78d6; --c-hbm:#eb6834; --c-latency:#1baf7a; --c-coll:#eda100; --c-idle:#b9b7b0;
  --c-roof:#0b0b0b;}@media (prefers-color-scheme:dark){:root:where(:not([data-theme=light])) .rs{
  --surface:#1a1a19; --surface-2:#232321; --grid:#2f2f2c; --axis:#4a4945;
  --text:#f0efec; --text-2:#c3c2b7; --text-3:#8f8d86;
  --c-tensor:#3987e5; --c-hbm:#d95926; --c-latency:#199e70; --c-coll:#c98500; --c-idle:#5d5c57;
  --c-roof:#f0efec;}}:root[data-theme=dark] .rs{
  --surface:#1a1a19; --surface-2:#232321; --grid:#2f2f2c; --axis:#4a4945;
  --text:#f0efec; --text-2:#c3c2b7; --text-3:#8f8d86;
  --c-tensor:#3987e5; --c-hbm:#d95926; --c-latency:#199e70; --c-coll:#c98500; --c-idle:#5d5c57;
  --c-roof:#f0efec;}.rs text{fill:var(--text-2);font-size:12px}.rs .t1{fill:var(--text);}.rs .t3{fill:var(--text-3);font-size:11px}.rs .grid{stroke:var(--grid);stroke-width:1}.rs .axis{stroke:var(--axis);stroke-width:1}.rs .roof{stroke:var(--c-roof);stroke-width:2;fill:none;stroke-linecap:round}.rs .bg{fill:var(--surface)}.rs .tensor{fill:var(--c-tensor)}.rs .hbm{fill:var(--c-hbm)}.rs .latency{fill:var(--c-latency)}.rs .coll{fill:var(--c-coll)}.rs .idle{fill:var(--c-idle)}.rs .bar{fill:var(--c-tensor)}.rs .dot{stroke:var(--surface);stroke-width:2;fill-opacity:.85}.rs [data-tip]:hover{opacity:.8}</style><rect class="bg" x="0" y="0" width="760" height="118"/><rect class="tensor" x="16.0" y="34" width="12.2" height="28" rx="4" data-tip="Tensor-bound: 1.7% of GPU time (15.9 µs of the 935.2 µs step per GPU)"/><rect class="tensor" x="22.2" y="34" width="6" height="28"/><rect class="hbm" x="30.2" y="34" width="179.8" height="28" rx="0" data-tip="HBM-bound: 25.0% of GPU time (233.5 µs of the 935.2 µs step per GPU)"/><text x="120.1" y="52.0" text-anchor="middle" style="fill:#ffffff;font-weight:600">25%</text><rect class="latency" x="212.0" y="34" width="380.9" height="28" rx="0" data-tip="Latency or pipeline bound: 52.9% of GPU time (494.7 µs of the 935.2 µs step per GPU)"/><text x="402.4" y="52.0" text-anchor="middle" style="fill:#0b0b0b;font-weight:600">53%</text><rect class="coll" x="594.9" y="34" width="39.8" height="28" rx="0" data-tip="Collectives: 5.5% of GPU time (51.7 µs of the 935.2 µs step per GPU)"/><rect class="idle" x="636.7" y="34" width="107.3" height="28" rx="4" data-tip="Idle: 14.9% of GPU time (139.4 µs of the 935.2 µs step per GPU)"/><rect class="idle" x="636.7" y="34" width="6" height="28"/><text x="690.4" y="52.0" text-anchor="middle" style="fill:#0b0b0b;font-weight:600">15%</text><rect class="tensor" x="16" y="83" width="10" height="10" rx="2"/><text x="31" y="92" class="t1">Tensor-bound 1.7%</text><rect class="hbm" x="157.0" y="83" width="10" height="10" rx="2"/><text x="172.0" y="92" class="t1">HBM-bound 25.0%</text><rect class="latency" x="284.0" y="83" width="10" height="10" rx="2"/><text x="299.0" y="92" class="t1">Latency or pipeline bound 52.9%</text><rect class="coll" x="523.0" y="83" width="10" height="10" rx="2"/><text x="538.0" y="92" class="t1">Collectives 5.5%</text><rect class="idle" x="657.0" y="83" width="10" height="10" rx="2"/><text x="672.0" y="92" class="t1">Idle 14.9%</text><text x="16" y="20" class="t1" style="font-weight:600;font-size:13px">Where the GPU time goes</text><text x="744" y="20" text-anchor="end" class="t3">share of all GPUs × step time</text></svg>