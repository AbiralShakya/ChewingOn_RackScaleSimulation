<svg class="rs" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" width="100%" role="img" aria-label="Step time by system" style="max-width:760px;height:auto"><style>.rs{font-family:Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
