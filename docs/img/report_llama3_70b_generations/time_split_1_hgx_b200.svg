<svg class="rs" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 118" width="100%" role="img" aria-label="Where the GPU time goes" style="max-width:760px;height:auto"><style>.rs{font-family:Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --surface:#fcfcfb; --surface-2:#f3f2ef; --grid:#e6e5e0; --axis:#c9c7c0;
  --text:#0b0b0b; --text-2:#52514e; --text-3:#7a7873;
  --c-tensor:#2a78d6; --c-hbm:#eb6834; --c-latency:#1baf7a; --c-coll:#eda100; --c-idle:#b9b7b0;
  --c-roof:#0b0b0b;}@media (prefers-color-scheme:dark){:root:where(:not([data-theme=light])) .rs{
  --surface:#1a1a19; --surface-2:#232321; --grid:#2f2f2c; --axis:#4a4945;
  --text:#f0efec; --text-2:#c3c2b7; --text-3:#8f8d86;
  --c-tensor:#3987e5; --c-hbm:#d95926; --c-latency:#199e70; --c-coll:#c98500; --c-idle:#5d5c57;
  --c-roof:#f0efec;}}:root[data-theme=dark] .rs{
  --surface:#1a1a19; --surface-2:#232321; --grid:#2f2f2c; --axis:#4a4945;
  --text:#f0efec; --text-2:#c3c2b7; --text-3:#8f8d86;
  --c-tensor:#3987e5; --c-hbm:#d95926; --c-latency:#199e70; --c-coll:#c98500; --c-idle:#5d5c57;
  --c-roof:#f0efec;}.rs text{fill:var(--text-2);font-size:12px}.rs .t1{fill:var(--text);}.rs .t3{fill:var(--text-3);font-size:11px}.rs .grid{stroke:var(--grid);stroke-width:1}.rs .axis{stroke:var(--axis);stroke-width:1}.rs .roof{stroke:var(--c-roof);stroke-width:2;fill:none;stroke-linecap:round}.rs .bg{fill:var(--surface)}.rs .tensor{fill:var(--c-tensor)}.rs .hbm{fill:var(--c-hbm)}.rs .latency{fill:var(--c-latency)}.rs .coll{fill:var(--c-coll)}.rs .idle{fill:var(--c-idle)}.rs .bar{fill:var(--c-tensor)}.rs .dot{stroke:var(--surface);stroke-width:2;fill-opacity:.85}.rs [data-tip]:hover{opacity:.8}</style><rect class="bg" x="0" y="0" width="760" height="118"/><rect class="hbm" x="16.0" y="34" width="276.3" height="28" rx="4" data-tip="HBM-bound: 38.3% of GPU time (124.0 µs of the 323.9 µs step per GPU)"/><rect class="hbm" x="286.3" y="34" width="6" height="28"/><text x="154.2" y="52.0" text-anchor="middle" style="fill:#ffffff;font-weight:600">38%</text><rect class="latency" x="294.3" y="34" width="147.8" height="28" rx="0" data-tip="Latency or pipeline bound: 20.5% of GPU time (66.3 µs of the 323.9 µs step per GPU)"/><text x="368.2" y="52.0" text-anchor="middle" style="fill:#0b0b0b;font-weight:600">20%</text><rect class="coll" x="444.1" y="34" width="115.2" height="28" rx="0" data-tip="Collectives: 16.0% of GPU time (51.7 µs of the 323.9 µs step per GPU)"/><text x="501.7" y="52.0" text-anchor="middle" style="fill:#0b0b0b;font-weight:600">16%</text><rect class="idle" x="561.3" y="34" width="182.7" height="28" rx="4" data-tip="Idle: 25.3% of GPU time (82.0 µs of the 323.9 µs step per GPU)"/><rect class="idle" x="561.3" y="34" width="6" height="28"/><text x="652.7" y="52.0" text-anchor="middle" style="fill:#0b0b0b;font-weight:600">25%</text><rect class="tensor" x="16" y="83" width="10" height="10" rx="2"/><text x="31" y="92" class="t1">Tensor-bound 0.0%</text><rect class="hbm" x="157.0" y="83" width="10" height="10" rx="2"/><text x="172.0" y="92" class="t1">HBM-bound 38.3%</text><rect class="latency" x="284.0" y="83" width="10" height="10" rx="2"/><text x="299.0" y="92" class="t1">Latency or pipeline bound 20.5%</text><rect class="coll" x="523.0" y="83" width="10" height="10" rx="2"/><text x="538.0" y="92" class="t1">Collectives 16.0%</text><rect class="idle" x="664.0" y="83" width="10" height="10" rx="2"/><text x="679.0" y="92" class="t1">Idle 25.3%</text><text x="16" y="20" class="t1" style="font-weight:600;font-size:13px">Where the GPU time goes</text><text x="744" y="20" text-anchor="end" class="t3">share of all GPUs × step time</text></svg>