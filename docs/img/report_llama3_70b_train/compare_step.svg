  --c-roof:#f0efec;}.rs text{fill:var(--text-2);font-size:12px}.rs .t1{fill:var(--text);}.rs .t3{fill:var(--text-3);font-size:11px}.rs .grid{stroke:var(--grid);stroke-width:1}.rs .axis{stroke:var(--axis);stroke-width:1}.rs .roof{stroke:var(--c-roof);stroke-width:2;fill:none;stroke-linecap:round}.rs .bg{fill:var(--surface)}.rs .tensor{fill:var(--c-tensor)}.rs .hbm{fill:var(--c-hbm)}.rs .latency{fill:var(--c-latency)}.rs .coll{fill:var(--c-coll)}.rs .idle{fill:var(--c-idle)}.rs .bar{fill:var(--c-tensor)}.rs .dot{stroke:var(--surface);stroke-width:2;fill-opacity:.85}.rs [data-tip]:hover{opacity:.8}</style><rect class="bg" x="0" y="0" width="760" height="176"/><text x="16" y="22" class="t1" style="font-weight:600;font-size:13px">Step time, split by where it goes</text><text x="140" y="61" text-anchor="end" class="t1">HGX H100</text><text x="140" y="75" text-anchor="end" class="t3">8 GPUs</text><rect class="tensor" x="150.0" y="48" width="247.4" height="22" data-tip="HGX H100: Tensor-bound 5.87 ms (50%)"/><rect class="hbm" x="399.4" y="48" width="31.5" height="22" data-tip="HGX H100: HBM-bound 747.6 µs (6%)"/><rect class="latency" x="432.9" y="48" width="50.5" height="22" data-tip="HGX H100: Latency or pipeline bound 1.20 ms (10%)"/><rect class="coll" x="485.4" y="48" width="80.0" height="22" data-tip="HGX H100: Collectives 1.90 ms (16%)"/><path class="idle" d="M567.4,48.0 H646.0 Q650.0,48.0 650.0,52.0 V66.0 Q650.0,70.0 646.0,70.0 H567.4 Z" data-tip="HGX H100: Idle 1.96 ms (17%)"/><text x="658.0" y="64" class="t1" style="font-weight:600">11.7 ms</text><text x="140" y="105" text-anchor="end" class="t1">HGX B200</text><text x="140" y="119" text-anchor="end" class="t3">8 GPUs</text><rect class="hbm" x="150.0" y="92" width="13.3" height="22" data-tip="HGX B200: HBM-bound 317.5 µs (5%)"/><rect class="latency" x="165.3" y="92" width="160.9" height="22" data-tip="HGX B200: Latency or pipeline bound 3.84 ms (62%)"/><rect class="coll" x="328.2" y="92" width="40.9" height="22" dat