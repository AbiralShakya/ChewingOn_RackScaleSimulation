  --c-roof:#f0efec;}.rs text{fill:var(--text-2);font-size:12px}.rs .t1{fill:var(--text);}.rs .t3{fill:var(--text-3);font-size:11px}.rs .grid{stroke:var(--grid);stroke-width:1}.rs .axis{stroke:var(--axis);stroke-width:1}.rs .roof{stroke:var(--c-roof);stroke-width:2;fill:none;stroke-linecap:round}.rs .bg{fill:var(--surface)}.rs .tensor{fill:var(--c-tensor)}.rs .hbm{fill:var(--c-hbm)}.rs .latency{fill:var(--c-latency)}.rs .coll{fill:var(--c-coll)}.rs .idle{fill:var(--c-idle)}.rs .bar{fill:var(--c-tensor)}.rs .dot{stroke:var(--surface);stroke-width:2;fill-opacity:.85}.rs [data-tip]:hover{opacity:.8}</style><rect class="bg" x="0" y="0" width="760" height="118"/><rect class="hbm" x="16.0" y="34" width="37.1" height="28" rx="4" data-tip="HBM-bound: 5.1% of GPU time (317.5 µs of the 6.18 ms step per GPU)"/><rect class="hbm" x="47.1" y="34" width="6" height="28"/><rect class="latency" x="55.1" y="34" width="449.2" height="28" rx="0" data-tip="Latency or pipeline bound: 62.2% of GPU time (3.84 ms of the 6.18 ms step per GPU)"/><text x="279.7" y="52.0" text-anchor="middle" style="fill:#0b0b0b;font-weight:600">62%</text><rect class="coll" x="506.3" y="34" width="114.2" height="28" rx="0" data-tip="Collectives: 15.8% of GPU time (976.6 µs of the 6.18 ms step per GPU)"/><text x="563.4" y="52.0" text-anchor="middle" style="fill:#0b0b0b;font-weight:600">16%</text><rect class="idle" x="622.5" y="34" width="121.5" height="28" rx="4" data-tip="Idle: 16.8% of GPU time (1.04 ms of the 6.18 ms step per GPU)"/><rect class="idle" x="622.5" y="34" width="6" height="28"/><text x="683.2" y="52.0" text-anchor="middle" style="fill:#0b0b0b;font-weight:600">17%</text><rect class="tensor" x="16" y="83" width="10" height="10" rx="2"/><text x="31" y="92" class="t1">Tensor-bound 0.0%</text><rect class="hbm" x="157.0" y="83" width="10" height="10" rx="2"/><text x="172.0" y="92" class="t1">HBM-bound 5.1%</text><rect class="latency" x="277.0" y="83" width="10" height="10" rx="2"/><text x="292.0" y="92" class="t1">Latency or pipeline bound 62.2%</text><rect class="coll" x="516.0" y="83" width="10" height="10" rx="2"/><text x="531.0" y="92" class="t1">Collectives 15.8%</text><rect class="idle" x="657.0" y="83" width="10" height="10" rx="2"/><text x="672.0" y="92" class="t1">Idle 16.8%</text><text x="16" y="20" class="t1" style="font-weight:600;font-size:13px">Where the GPU time goes</text><text x="744" y="20" text-anchor="end" class="t3">share of all GPUs × step time</text></svg>