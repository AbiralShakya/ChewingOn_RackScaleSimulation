[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "rackscale"
description = "Rack-scale, cycle-level GPU simulation for inference and training (Hopper, Blackwell, GB200 NVL72)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
classifiers = ["Programming Language :: Rust", "Programming Language :: Python :: 3", "Topic :: Scientific/Engineering"]
dynamic = ["version"]

[project.optional-dependencies]
test = ["pytest>=7"]
agent = ["mcp>=1.2"]

[project.scripts]
rackscale = "rackscale.cli:main"
rackscale-mcp = "rackscale.mcp_server:main"
rsim = "rackscale.cli:rsim_entry"

[tool.maturin]
manifest-path = "crates/rsim-py/Cargo.toml"
module-name = "rackscale._native"
python-source = "python"
features = ["pyo3/extension-module"]
