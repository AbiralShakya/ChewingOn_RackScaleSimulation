# 72 B300s as nine HGX B300 nodes (NVLink5 inside a node, one 400G NDR NIC per
# GPU between nodes, rail-optimised leaf switches): the same GPUs as NVL72
# without the rack-wide NVLink domain.
name: 9x HGX B300 over 400G IB (calibrated B300)
gpus:
  - preset: b300
    count: 72
    calibration: research/flash_attention/calibration/b300-sxm6-ac-sm103.json
topology:
  kind: multi_node
  nodes: 9
  intra:
    kind: switched
    switches: 2
    switch: {name: NVLink5 switch, ports: 72, gbps_per_port_per_dir: 50.0, latency_ns: 100.0, in_network_reduction: true}
    links_per_gpu_per_switch: [9, 9]
    link: {gbps_per_dir: 50.0, latency_ns: 20.0}
  nic: {gbps_per_dir: 50.0, latency_ns: 600.0}
  leaf: {name: IB NDR leaf, ports: 128, gbps_per_port_per_dir: 50.0, latency_ns: 300.0, in_network_reduction: false}
