<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rackscale viewer</title>
<!--
  rackscale viewer: one self-contained page that draws an rsviz/1 bundle
  from the rack's links down to per-instruction stall samples.
  `rsim viz ... -o page.html` embeds the bundle below. Opened bare, the page
  asks for a bundle file (.json or .json.gz), or loads ?src=<url>.
  Field reference: docs/VIZ.md.
-->
<style>
:root {
  color-scheme: light;
  --bg: #f4f3ef;
  --surface: #fcfcfb;
  --surface-2: #efeee9;
  --line: #dcdbd5;
  --grid: #e8e7e2;
  --text: #0b0b0b;
  --text-2: #52514e;
  --text-3: #7d7c76;
  --accent: #2a78d6;
  --sel: #0b0b0b;
  --c-issued: #2a78d6;
  --c-mem: #eb6834;
  --c-dep: #1baf7a;
  --c-pipe: #eda100;
  --c-async: #e87ba4;
  --c-tensor: #6250d6;
  --c-sync: #e34948;
  --c-notsel: #b9b8b2;
  --c-idle: #e4e3de;
  --c-green: #008300;
  --seq-0: #cde2fb;
  --seq-1: #86b6ef;
  --seq-2: #3987e5;
  --seq-3: #1c5cab;
  --seq-4: #0d366b;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #121211; --surface: #1a1a19; --surface-2: #232321; --line: #353532; --grid: #2a2a28;
    --text: #f0efec; --text-2: #c3c2b7; --text-3: #8e8d86; --accent: #3987e5; --sel: #f0efec;
    --c-issued: #3987e5; --c-mem: #d95926; --c-dep: #199e70; --c-pipe: #c98500; --c-async: #d55181;
    --c-tensor: #9085e9; --c-sync: #e66767; --c-notsel: #6b6a64; --c-idle: #33332f; --c-green: #008300;
    --seq-0: #1b2a3d; --seq-1: #184f95; --seq-2: #2a78d6; --seq-3: #6da7ec; --seq-4: #cde2fb;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121211; --surface: #1a1a19; --surface-2: #232321; --line: #353532; --grid: #2a2a28;
  --text: #f0efec; --text-2: #c3c2b7; --text-3: #8e8d86; --accent: #3987e5; --sel: #f0efec;
  --c-issued: #3987e5; --c-mem: #d95926; --c-dep: #199e70; --c-pipe: #c98500; --c-async: #d55181;
  --c-tensor: #9085e9; --c-sync: #e66767; --c-notsel: #6b6a64; --c-idle: #33332f; --c-green: #008300;
  --seq-0: #1b2a3d; --seq-1: #184f95; --seq-2: #2a78d6; --seq-3: #6da7ec; --seq-4: #cde2fb;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 var(--sans); }
a { color: var(--accent); }
header { position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 10px 16px; max-width: 1480px; margin: 0 auto; }
.brand { font-weight: 650; letter-spacing: -0.01em; }
.brand small { font-weight: 400; color: var(--text-3); margin-left: 6px; }
.crumbs { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; color: var(--text-3); min-width: 0; }
.crumbs button { border: 0; background: none; color: var(--accent); padding: 2px 4px; cursor: pointer; font: inherit; border-radius: 4px; }
.crumbs button:hover { background: var(--surface-2); }
.crumbs .cur { color: var(--text); font-weight: 600; padding: 2px 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 46ch; }
.spacer { flex: 1; }
select, input[type=search], .btn { font: inherit; color: var(--text); background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
.btn { cursor: pointer; }
.btn:hover { border-color: var(--text-3); }
main { max-width: 1480px; margin: 0 auto; padding: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 16px; min-width: 0; }
.card h2 { font-size: 15px; margin: 0 0 2px; font-weight: 650; }
.card .sub { color: var(--text-2); font-size: 13px; margin: 0 0 10px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 900px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
.kpis { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; min-width: 130px; flex: 1 1 130px; }
.kpi .v { font-size: 22px; font-weight: 650; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.kpi .l { color: var(--text-2); font-size: 12px; }
.canvas-wrap { position: relative; width: 100%; overflow: hidden; border-radius: 6px; background: var(--surface); }
canvas { display: block; width: 100%; touch-action: none; }
.hint { color: var(--text-3); font-size: 12px; margin-top: 6px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--text-2); margin: 6px 0 4px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--grid); vertical-align: middle; }
th { color: var(--text-2); font-weight: 600; font-size: 12px; position: sticky; top: 0; background: var(--surface); cursor: pointer; white-space: nowrap; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--surface-2); }
tr.sel td { background: color-mix(in srgb, var(--accent) 14%, transparent); }
.scroll { max-height: 560px; overflow: auto; }
.sass td.code { font: 12.5px/1.35 var(--mono); white-space: pre; }
.sass td.pc { font: 12px var(--mono); color: var(--text-3); }
.op { font-weight: 650; }
.chip { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 9px; background: var(--surface-2); color: var(--text-2); border: 1px solid var(--line); white-space: nowrap; }
.stack { display: flex; height: 10px; border-radius: 3px; overflow: hidden; min-width: 60px; background: var(--surface-2); gap: 1px; }
.stack b { display: block; height: 100%; }
.hbar { height: 8px; border-radius: 0 4px 4px 0; background: var(--c-issued); }
#tip { position: fixed; z-index: 20; pointer-events: none; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: 0 6px 24px rgba(0,0,0,.18); max-width: 420px; display: none; }
#tip .t { font-weight: 650; margin-bottom: 2px; word-break: break-all; }
#tip .m { font-family: var(--mono); font-size: 11.5px; }
#tip .r { color: var(--text-2); }
.empty { text-align: center; padding: 80px 20px; color: var(--text-2); }
.empty .drop { border: 2px dashed var(--line); border-radius: 14px; padding: 40px; margin: 20px auto; max-width: 560px; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tabs button { font: inherit; border: 1px solid var(--line); background: var(--surface-2); color: var(--text-2); border-radius: 6px; padding: 3px 10px; cursor: pointer; }
.tabs button.on { background: var(--text); color: var(--surface); border-color: var(--text); }
.row { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin-bottom: 8px; }
.note { color: var(--text-2); font-size: 13px; }
.mono { font-family: var(--mono); font-size: 12px; }
</style>
</head>
<body>
<header><div class="bar">
  <div class="brand">rackscale<small>viewer</small></div>
  <div class="crumbs" id="crumbs"></div>
  <div class="spacer"></div>
  <select id="runSel" aria-label="Run"></select>
  <button class="btn" id="themeBtn" title="Toggle light/dark">◐</button>
</div></header>
<main id="main"></main>
<div id="tip"></div>
<script type="application/json" id="rsviz-data">/*RSVIZ_DATA*/</script>
<script>
"use strict";
// ---------------------------------------------------------------- data ---
const FAMILIES = [
  // key, label, css var, stall names (Nsight-style warp states)
  ["issued", "Issued", "--c-issued", ["selected"]],
  ["mem", "Memory (long scoreboard, LG throttle)", "--c-mem", ["long_scoreboard", "lg_throttle"]],
  ["dep", "Dependency (fixed latency, short scoreboard)", "--c-dep", ["wait", "short_scoreboard"]],
  ["pipe", "Pipe / MIO throttle", "--c-pipe", ["math_pipe_throttle", "mio_throttle"]],
  ["async", "mbarrier / TMA wait", "--c-async", ["async_wait", "tma_wait"]],
  ["tensor", "Tensor core (wait, throttle)", "--c-tensor", ["tensor_wait", "tensor_throttle"]],
  ["sync", "Barrier, fence, branch", "--c-sync", ["barrier", "membar", "branch_resolving"]],
  ["notsel", "Eligible, not selected", "--c-notsel", ["not_selected"]],
  ["idle", "Drain / idle", "--c-idle", ["drain", "idle"]],
];
const KCATS = [
  ["gemm", "GEMM / linear", "--c-issued"],
  ["moe", "MoE experts", "--c-mem"],
  ["norm", "Norm / elementwise", "--c-dep"],
  ["ssm", "SSM / scan", "--c-pipe"],
  ["attn", "Attention", "--c-tensor"],
  ["coll", "Collective", "--c-sync"],
  ["other", "Other", "--c-notsel"],
];
function kcat(name, kind) {
  if (kind === 1) return "coll";
  const n = name.toLowerCase();
  if (/allreduce|all_reduce|alltoall|all_to_all|allgather|reduce_scatter|dispatch|combine|nccl|sendrecv|ring/.test(n)) return "coll";
  if (/attn|attention|fmha|flash|mla|sdpa/.test(n)) return "attn";
  if (/moe|expert|grouped/.test(n)) return "moe";
  if (/ssd|ssm|scan|mamba|conv1d|chunk|state/.test(n)) return "ssm";
  if (/norm|rms|layernorm|softmax|elementwise|silu|gelu|rope|act|add|embed|sample|topk|router|gate/.test(n)) return n.includes("gate_up") ? "gemm" : "norm";
  if (/gemm|linear|matmul|proj|mlp|lm_head|qkv|_o\b|wq|wkv|ffn|up|down|dense|mm/.test(n)) return "gemm";
  return "other";
}
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
let COL = {};
function readColors() {
  COL = {};
  for (const f of FAMILIES) COL[f[0]] = css(f[2]);
  for (const k of KCATS) COL["k_" + k[0]] = css(k[2]);
  for (const v of ["--text", "--text-2", "--text-3", "--grid", "--line", "--surface", "--surface-2", "--accent", "--sel", "--seq-0", "--seq-1", "--seq-2", "--seq-3", "--seq-4"]) COL[v] = css(v);
}

let B = null;          // bundle
let R = null;          // current run
let S = { run: 0, view: "rack", rank: 0, k: -1, sm: null, pc: null };

function prepRun(run) {
  if (run._prep) return run;
  run._prep = true;
  const stallIdx = {};
  run.stalls.forEach((n, i) => stallIdx[n] = i);
  // stall index -> family index
  run._fam = run.stalls.map(n => Math.max(0, FAMILIES.findIndex(f => f[3].includes(n))));
  run._ghz = (rank) => run.system.gpus[run.system.rank_gpu[rank] ?? 0].clock_mhz / 1000;
  run._gpu = (rank) => run.system.gpus[run.system.rank_gpu[rank] ?? 0];
  run._str = (i) => run.strings[i] ?? "";
  for (const r of run.ranks) {
    const sp = r.spans, out = [];
    for (let i = 0; i < sp.length; i += 6) {
      const label = run.strings[sp[i + 2]];
      out.push({ stream: sp[i], kind: sp[i + 1], label, t0: sp[i + 3], t1: sp[i + 4], k: sp[i + 5], cat: kcat(label, sp[i + 1]) });
    }
    r._spans = out;
    r._streams = out.reduce((m, s) => Math.max(m, s.stream + 1), 1);
  }
  run.kernels.forEach((k, i) => { k._i = i; k._name = run.strings[k.name]; k._t0 = k.start / run._ghz(k.rank); k._t1 = (k.start + k.cycles) / run._ghz(k.rank); });
  run._makespan_ns = Math.max(1, ...run.ranks.map(r => r._spans.reduce((m, s) => Math.max(m, s.t1), 0)));
  return run;
}
function famOf(run, arr) { // stall-count array -> family totals
  const out = new Array(FAMILIES.length).fill(0);
  arr.forEach((v, i) => out[run._fam[i]] += v);
  return out;
}

// ------------------------------------------------------------- helpers ---
const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v; else if (k === "html") e.innerHTML = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else if (v !== null && v !== undefined) e.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c !== null && c !== undefined && c !== false) e.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return e;
};
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function fmtT(ns) {
  const a = Math.abs(ns);
  if (a >= 1e6) return (ns / 1e6).toFixed(a >= 1e7 ? 1 : 2) + " ms";
  if (a >= 1e3) return (ns / 1e3).toFixed(a >= 1e4 ? 1 : 2) + " µs";
  return ns.toFixed(a >= 100 ? 0 : 1) + " ns";
}
const pct = (x, d = 1) => (100 * x).toFixed(d) + "%";
const fmtN = (x) => x >= 1e9 ? (x / 1e9).toFixed(2) + "G" : x >= 1e6 ? (x / 1e6).toFixed(2) + "M" : x >= 1e4 ? (x / 1e3).toFixed(1) + "k" : String(Math.round(x));
const fmtC = (c) => fmtN(c) + " cyc";
const tip = $("#tip");
function showTip(e, html) {
  tip.innerHTML = html; tip.style.display = "block";
  const pad = 14, w = tip.offsetWidth, hh = tip.offsetHeight;
  let x = e.clientX + pad, y = e.clientY + pad;
  if (x + w > innerWidth - 8) x = e.clientX - w - pad;
  if (y + hh > innerHeight - 8) y = e.clientY - hh - pad;
  tip.style.left = Math.max(8, x) + "px"; tip.style.top = Math.max(8, y) + "px";
}
const hideTip = () => tip.style.display = "none";
function stackBar(run, fam, total) {
  const t = total ?? fam.reduce((a, b) => a + b, 0);
  const el = h("div", { class: "stack", title: FAMILIES.map((f, i) => fam[i] ? `${f[1]}: ${pct(fam[i] / t)}` : "").filter(Boolean).join("\n") });
  if (!t) return el;
  fam.forEach((v, i) => { if (v / t > 0.002) el.append(h("b", { style: `width:${100 * v / t}%;background:var(${FAMILIES[i][2]})` })); });
  return el;
}
function famLegend(fams) {
  return h("div", { class: "legend" }, FAMILIES.filter((f, i) => !fams || fams[i] > 0).map(f => h("span", {}, h("i", { style: `background:var(${f[2]})` }), f[1])));
}
function seqColor(x) { // 0..1 -> sequential blue
  const st = [COL["--seq-0"], COL["--seq-1"], COL["--seq-2"], COL["--seq-3"], COL["--seq-4"]];
  const i = Math.min(4, Math.max(0, Math.floor(x * 4.999)));
  return st[i];
}

// ------------------------------------------------- generic zoomable lane ---
// rows: [{label, sub}], draw(ctx, X, y0, rowH, rowIndex, visible [t0,t1]),
// hit(t, rowIndex) -> {html, onclick} | null
class Lanes {
  constructor(opts) {
    this.o = Object.assign({ rowH: 16, gap: 1, labelW: 120, axisH: 22, unit: fmtT, maxH: 620 }, opts);
    this.t0 = this.o.t0; this.t1 = this.o.t1;
    this.full = [this.o.t0, this.o.t1];
    this.wrap = h("div", { class: "canvas-wrap" });
    this.cv = h("canvas"); this.wrap.append(this.cv);
    this.scrollY = 0;
    this.bind();
    new ResizeObserver(() => this.draw()).observe(this.wrap);
  }
  get H() { return this.o.axisH + this.o.rows.length * this.o.rowH; }
  viewH() { return Math.min(this.H, this.o.maxH); }
  X(t) { const w = this.cv.clientWidth - this.o.labelW; return this.o.labelW + (t - this.t0) / (this.t1 - this.t0) * w; }
  T(x) { const w = this.cv.clientWidth - this.o.labelW; return this.t0 + (x - this.o.labelW) / w * (this.t1 - this.t0); }
  setRange(a, b) { const span = this.full[1] - this.full[0]; const minSpan = this.o.minSpan ?? span * 1e-6; if (b - a < minSpan) { const m = (a + b) / 2; a = m - minSpan / 2; b = m + minSpan / 2; } this.t0 = a; this.t1 = b; this.draw(); this.o.onRange?.(a, b); }
  bind() {
    const cv = this.cv;
    let drag = null;
    cv.addEventListener("wheel", (e) => {
      if (Math.abs(e.deltaX) > Math.abs(e.deltaY) && !e.ctrlKey) { const dt = e.deltaX / cv.clientWidth * (this.t1 - this.t0); this.setRange(this.t0 + dt, this.t1 + dt); e.preventDefault(); return; }
      if (e.shiftKey && this.H > this.viewH()) { this.scrollY = Math.max(0, Math.min(this.H - this.viewH(), this.scrollY + e.deltaY)); this.draw(); e.preventDefault(); return; }
      const r = cv.getBoundingClientRect(), x = e.clientX - r.left;
      if (x < this.o.labelW) { if (this.H > this.viewH()) { this.scrollY = Math.max(0, Math.min(this.H - this.viewH(), this.scrollY + e.deltaY)); this.draw(); e.preventDefault(); } return; }
      const t = this.T(x), k = Math.exp(e.deltaY * 0.0015);
      this.setRange(t - (t - this.t0) * k, t + (this.t1 - t) * k);
      e.preventDefault();
    }, { passive: false });
    cv.addEventListener("pointerdown", (e) => { drag = { x: e.clientX, y: e.clientY, t0: this.t0, t1: this.t1, sy: this.scrollY, moved: false }; cv.setPointerCapture(e.pointerId); });
    cv.addEventListener("pointermove", (e) => {
      if (drag) {
        const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
        if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true;
        const dt = -dx / (cv.clientWidth - this.o.labelW) * (drag.t1 - drag.t0);
        this.t0 = drag.t0 + dt; this.t1 = drag.t1 + dt;
        if (this.H > this.viewH()) this.scrollY = Math.max(0, Math.min(this.H - this.viewH(), drag.sy - dy));
        this.draw(); hideTip(); return;
      }
      this.hover(e);
    });
    cv.addEventListener("pointerup", (e) => { const d = drag; drag = null; if (d && !d.moved) this.click(e); if (d?.moved) this.o.onRange?.(this.t0, this.t1); });
    cv.addEventListener("pointerleave", hideTip);
    cv.addEventListener("dblclick", () => this.setRange(...this.full));
  }
  at(e) {
    const r = this.cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top + this.scrollY - this.o.axisH;
    const row = Math.floor(y / this.o.rowH);
    if (x < this.o.labelW || row < 0 || row >= this.o.rows.length) return { x, row: -1, t: this.T(x) };
    return { x, row, t: this.T(x), px: (this.t1 - this.t0) / (this.cv.clientWidth - this.o.labelW) };
  }
  hover(e) {
    const a = this.at(e);
    if (a.row < 0) { const lab = this.o.rows[Math.floor((e.clientY - this.cv.getBoundingClientRect().top + this.scrollY - this.o.axisH) / this.o.rowH)]; if (lab?.tip && a.x < this.o.labelW) { showTip(e, lab.tip); this.cv.style.cursor = lab.onclick ? "pointer" : "default"; } else { hideTip(); this.cv.style.cursor = "grab"; } return; }
    const r = this.o.hit?.(a.t, a.row, a.px);
    this.cv.style.cursor = r?.onclick ? "pointer" : "grab";
    if (r) showTip(e, r.html); else hideTip();
  }
  click(e) {
    const a = this.at(e);
    if (a.row < 0) { const row = Math.floor((e.clientY - this.cv.getBoundingClientRect().top + this.scrollY - this.o.axisH) / this.o.rowH); const lab = this.o.rows[row]; if (lab?.onclick && a.x < this.o.labelW) lab.onclick(); return; }
    const r = this.o.hit?.(a.t, a.row, a.px);
    r?.onclick?.();
  }
  draw() {
    const cv = this.cv, dpr = devicePixelRatio || 1, W = cv.clientWidth || this.wrap.clientWidth, Hh = this.viewH();
    if (!W) return;
    cv.style.height = Hh + "px";
    cv.width = Math.round(W * dpr); cv.height = Math.round(Hh * dpr);
    const ctx = cv.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = COL["--surface"]; ctx.fillRect(0, 0, W, Hh);
    const { rowH, labelW, axisH, rows } = this.o;
    // grid + axis
    const span = this.t1 - this.t0, target = span / Math.max(2, (W - labelW) / 110);
    const p10 = Math.pow(10, Math.floor(Math.log10(target)));
    const step = [1, 2, 5, 10].map(m => m * p10).find(s => s >= target) || p10 * 10;
    ctx.font = "11px " + css("--sans"); ctx.textBaseline = "middle";
    ctx.strokeStyle = COL["--grid"]; ctx.lineWidth = 1; ctx.fillStyle = COL["--text-3"];
    for (let t = Math.ceil(this.t0 / step) * step; t <= this.t1; t += step) {
      const x = Math.round(this.X(t)) + 0.5;

function famTable(fam, raw) {
  const t = fam.reduce((a, b) => a + b, 0) || 1;
  const tb = h("table", { style: "margin-top:10px" });
  // detailed reasons, largest first
  const rows = raw.map((v, i) => [R.stalls[i], v, R._fam[i]]).filter(r => r[1] > 0).sort((a, b) => b[1] - a[1]);
  const tot = rows.reduce((a, r) => a + r[1], 0) || 1;
  tb.append(h("tr", {}, h("th", {}, "reason"), h("th", { class: "num" }, "share"), h("th", { style: "width:40%" }, "")));
  rows.forEach(([n, v, f]) => tb.append(h("tr", {}, h("td", {}, h("span", { class: "legend", style: "margin:0" }, h("span", {}, h("i", { style: `background:var(${FAMILIES[f][2]})` }), n.replace(/_/g, " ")))), h("td", { class: "num" }, pct(v / tot)), h("td", {}, h("div", { class: "hbar", style: `width:${100 * v / rows[0][1]}%;background:var(${FAMILIES[f][2]})` })))));
  return tb;
}

function compareCard(m) {
  const card = h("div", { class: "card" }, h("h2", {}, "All runs in this file"), h("p", { class: "sub" }, "Side by side: time, utilisation and where scheduler cycles went. Click a run to open it."));
  const tb = h("table", {}, h("tr", {}, h("th", {}, "run"), h("th", { class: "num" }, "time"), h("th", { class: "num" }, "GPUs"), h("th", { class: "num" }, "tensor"), h("th", { class: "num" }, "issue"), h("th", { style: "width:30%" }, "scheduler cycles")));
  B.runs.forEach((run, i) => {
    prepRun(run);
    const sch = new Array(run.stalls.length).fill(0);
    let tu = 0, iu = 0, tt = 0;
    for (const k of run.kernels) { k.sched.forEach((v, j) => sch[j] += v); const d = k.cycles; tu += k.tensor_util * d; iu += k.issue_util * d; tt += d; }
    tb.append(h("tr", { class: "click" + (i === S.run ? " sel" : ""), onclick: () => { $("#runSel").value = i; go({ run: i, view: run.kind === "rack" ? "rack" : "kernel", k: 0, rank: 0, sm: null, pc: null }); } },
      h("td", {}, run.name), h("td", { class: "num" }, fmtT(run.makespan_us * 1e3)), h("td", { class: "num" }, run.ranks.length), h("td", { class: "num" }, pct(tu / Math.max(1, tt))), h("td", { class: "num" }, pct(iu / Math.max(1, tt))), h("td", {}, stackBar(run, famOf(run, sch)))));
  });
  card.append(tb, famLegend());
  m.append(card);
}

// ----------------------------------------------------------------- boot ---
function start(bundle) {
  if (!bundle || bundle.format !== "rsviz/1") throw new Error("not an rsviz/1 bundle");
  B = bundle;
  document.title = (B.title || "rackscale") + " · rackscale viewer";
  const sel = $("#runSel"); sel.innerHTML = "";
  B.runs.forEach((r, i) => sel.append(h("option", { value: i }, r.name)));
  sel.style.display = B.runs.length > 1 ? "" : "none";
  sel.onchange = () => { const r = B.runs[+sel.value]; go({ run: +sel.value, view: r.kind === "rack" ? "rack" : "kernel", k: 0, rank: 0, sm: null, pc: null }); };
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.has("run") && B.runs[+p.get("run")]) {
    S.run = +p.get("run"); S.view = p.get("view") || "rack"; S.rank = +p.get("rank") || 0; S.k = +(p.get("k") ?? -1); S.sm = p.get("sm") ? +p.get("sm") : null;
  } else S.view = B.runs[0].kind === "rack" ? "rack" : "kernel";
  sel.value = S.run;
  render();
}
async function loadFile(file) {
  let stream = file.stream();
  if (file.name.endsWith(".gz")) stream = stream.pipeThrough(new DecompressionStream("gzip"));
  const text = await new Response(stream).text();
  start(JSON.parse(text));
}
function emptyState(msg) {
  const m = $("#main"); m.innerHTML = "";
  const inp = h("input", { type: "file", accept: ".json,.gz", onchange: (e) => e.target.files[0] && loadFile(e.target.files[0]).catch(err => emptyState(String(err))) });
  const d = h("div", { class: "drop" }, h("p", {}, "Drop an rsviz bundle here (.json or .json.gz), or choose one:"), inp,
    h("p", { class: "note" }, "Make one with ", h("span", { class: "mono" }, "rsim viz path fa4.rpath --gpu b300 -o fa4.json"), " or any other ", h("span", { class: "mono" }, "rsim viz"), " command."));
  m.append(h("div", { class: "empty" }, msg ? h("p", { style: "color:var(--c-sync)" }, msg) : null, d));
  document.addEventListener("dragover", e => e.preventDefault());
  document.addEventListener("drop", e => { e.preventDefault(); const f = e.dataTransfer.files[0]; if (f) loadFile(f).catch(err => emptyState(String(err))); });
}
$("#themeBtn").onclick = () => {
  const root = document.documentElement, dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("rsviz-theme", root.dataset.theme); } catch (e) { }
  if (B) render();
};
try { const t = localStorage.getItem("rsviz-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) { }
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", () => B && render());
(async () => {
  readColors();
  const raw = $("#rsviz-data").textContent.trim();
  try {
    if (raw.startsWith("gz:")) {
      const bin = Uint8Array.from(atob(raw.slice(3)), c => c.charCodeAt(0));
      return start(JSON.parse(await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream("gzip"))).text()));
    }
    if (raw && !raw.startsWith("/*")) return start(JSON.parse(raw));
    const src = new URLSearchParams(location.search).get("src");
    if (src) {
      const r = await fetch(src); let body = r.body;
      if (src.endsWith(".gz")) body = body.pipeThrough(new DecompressionStream("gzip"));
      return start(JSON.parse(await new Response(body).text()));
    }
    emptyState();
  } catch (e) { emptyState("Could not load bundle: " + e.message); console.error(e); }
})();
